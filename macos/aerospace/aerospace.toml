# AeroSpace — config personal (base: default v0.21.3-Beta)
config-version = 2

start-at-login = false              # lo maneja el LaunchAgent (más robusto)
auto-reload-config = true

# Avisar a sketchybar cuando cambia el workspace (resalta el activo)
exec-on-workspace-change = ['/bin/bash', '-c',
  '~/.local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 10
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

automatically-unhide-macos-hidden-apps = true

# El mouse sigue al foco (teclas, workspaces, iPad <-> Mac). Lazy: si ya está
# dentro de la ventana enfocada no se mueve, así los clics no lo hacen saltar.
on-focus-changed = ['move-mouse window-lazy-center']

# La barra muestra siempre estos 5, aunque estén vacíos
persistent-workspaces = ["1", "2", "3", "4", "5"]

focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Gaps chicos para que se note la separación; bar-toggle.sh ajusta el de arriba según la barra
gaps.inner.horizontal = 2
gaps.inner.vertical = 2
gaps.outer.left = 2
gaps.outer.bottom = 2
gaps.outer.top =        36
gaps.outer.right = 2

# El 1 vive en el iPad (Sidecar); el resto, en la pantalla principal
[workspace-to-monitor-force-assignment]
1 = 'secondary'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'

[mode.main.binding]
    # Abrir / levantar apps (consonantes: no pisan tildes de Option+vocal/n)
    alt-enter = 'exec-and-forget /Applications/kitty.app/Contents/MacOS/kitty --single-instance --directory ~'  # ventana nueva, mismo proceso
    alt-shift-enter = 'exec-and-forget /bin/sh -c "cd ~; exec /Applications/kitty.app/Contents/MacOS/kitten quick-access-terminal"'  # scratchpad: toggle, abre en ~
    alt-f = 'exec-and-forget open -a Finder'

    # Alt+Shift+B: alterna la barra entre modo lab (ip/vpn/target) y sys (wifi/vol/bat/cpu/ram)
    alt-shift-b = 'exec-and-forget ~/.config/sketchybar/toggle.sh'

    # Alt+M: minimiza la ventana enfocada; si la app ya tiene minimizadas, las restaura
    alt-m = 'exec-and-forget ~/.config/sketchybar/toggle-min.sh'
    # Alt+Shift+M: RESCATE - restaura todas las ventanas minimizadas (si una se pierde)
    alt-shift-m = 'exec-and-forget ~/.config/sketchybar/restore-min-all.sh'

    # Alt+Shift+F: zoom (fullscreen del tiling) - expande la ventana enfocada; de nuevo, vuelve
    alt-shift-f = 'fullscreen'

    # Alt+B: ocultar / mostrar la barra
    alt-b = 'exec-and-forget ~/.config/sketchybar/bar-toggle.sh'

    # Alt+Shift+T: modo tema (h/l preview)  ·  Alt+Shift+W: modo wallpaper (h/l preview)
    alt-shift-t = ['exec-and-forget ~/.config/sketchybar/cycle-theme.sh cur', 'mode theme']
    alt-shift-w = ['exec-and-forget ~/.config/sketchybar/cycle-wall.sh cur', 'mode wall']

    # Layout: Alt+T alterna tiles <-> accordion (no uso / ni , por el teclado latino)
    alt-t = 'layout tiles accordion'
    # Alt+V: cambia la orientación del split (al lado <-> apilado). Define cómo se
    # abre la PRÓXIMA ventana. Es el equivalente i3 al auto-dwindle de bspwm/hypr.
    alt-v = 'layout horizontal vertical'

    # Foco (h/j/k/l)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Mover ventana
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize: Alt+R entra a modo resize (evita chocar con \ y | del teclado latino)
    alt-r = ['exec-and-forget ~/.config/sketchybar/mode-show.sh "RESIZE   h/l ancho   j/k alto   esc"', 'mode resize']

    # Workspaces 1-5
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    # Mover ventana a workspace 1-5 (el foco se va con ella)
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'

    # Navegación entre workspaces
    alt-tab = 'workspace-back-and-forth'

# Modo TEMA: h/l (o flechas) previsualizan el tema vecino; enter/esc salen
[mode.theme.binding]
    h = 'exec-and-forget ~/.config/sketchybar/cycle-theme.sh prev'
    l = 'exec-and-forget ~/.config/sketchybar/cycle-theme.sh next'
    left  = 'exec-and-forget ~/.config/sketchybar/cycle-theme.sh prev'
    right = 'exec-and-forget ~/.config/sketchybar/cycle-theme.sh next'
    enter = ['exec-and-forget ~/.config/sketchybar/picker-hide.sh', 'mode main']
    esc   = ['exec-and-forget ~/.config/sketchybar/picker-hide.sh', 'mode main']

# Modo WALLPAPER: h/l (o flechas) previsualizan el fondo vecino; enter/esc salen
[mode.wall.binding]
    h = 'exec-and-forget ~/.config/sketchybar/cycle-wall.sh prev'
    l = 'exec-and-forget ~/.config/sketchybar/cycle-wall.sh next'
    left  = 'exec-and-forget ~/.config/sketchybar/cycle-wall.sh prev'
    right = 'exec-and-forget ~/.config/sketchybar/cycle-wall.sh next'
    enter = ['exec-and-forget ~/.config/sketchybar/picker-hide.sh', 'mode main']
    esc   = ['exec-and-forget ~/.config/sketchybar/picker-hide.sh', 'mode main']

# Modo RESIZE: h/l ancho, j/k alto; enter/esc salen. (Alt+R para entrar)
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    j = 'resize height +50'
    k = 'resize height -50'
    enter = ['exec-and-forget ~/.config/sketchybar/picker-hide.sh', 'mode main']
    esc   = ['exec-and-forget ~/.config/sketchybar/picker-hide.sh', 'mode main']

# Mosaico en espiral: desde la tercera ventana, cada nueva parte a la anterior
# alternando horizontal y vertical (ver dwindle.sh). Va al final para que las
# reglas de arriba se apliquen primero.
[[on-window-detected]]
if = 'true'
run = 'exec-and-forget ~/.config/aerospace/dwindle.sh'
